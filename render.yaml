services:
  - type: web
    name: download-tube
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: >-
      cd $HOME/bgutil-ytdlp-pot-provider/server &&
      node build/main.js &
      sleep 3 &&
      cd /opt/render/project/src/backend &&
      uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: NODE_VERSION
        value: "20.18.0"
